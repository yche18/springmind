server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/springmind
    username: root
    password: 123456
  flyway:
    enabled: true
  ai:
    model:
      embedding: ollama
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: qllama/bge-small-zh-v1.5
          # 单个输入超过模型 context length 时由 Ollama 截断，避免上传链路直接失败。
          truncate: true
    vectorstore:
      pgvector:
        # 向量索引类型
        index-type: HNSW
        # 距离度量，余弦值
        distance-type: COSINE_DISTANCE
        # 向量维度
        dimensions: 512
        # 批量处理大小
        max-document-batch-size: 9
        # 启动时是否自动创建表
        initialize-schema: true
        # 创建表名
        table-name: vector_store

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:springmind-documents}

ingestion:
  chunking:
    target-tokens: 240
    max-tokens: 320
    overlap-tokens: 32
  vector:
    # 控制业务侧每次调用 VectorStore.add 的 chunk 数量，降低单次 Ollama embedding 请求压力。
    add-batch-size: 9

elasticsearch:
  host: localhost
  port: 9200
  scheme: http
  index-name: springmind_document_chunks

springmind:
  auth:
    issuer: springmind
    access-token-expire-minutes: 30
    refresh-token-expire-days: 14
    # 仅开发环境兜底，生产环境仍应显式配置安全密钥。
    jwt-secret: ${SPRINGMIND_JWT_SECRET:springmind-dev-jwt-secret-2026-04-20-32bytes}
    refresh-cookie-name: SPRINGMIND_REFRESH_TOKEN
    refresh-cookie-secure: false
  dev-admin:
    username: ${SPRINGMIND_DEV_ADMIN_USERNAME:admin}
    email: ${SPRINGMIND_DEV_ADMIN_EMAIL:admin@local.springmind.test}
    display-name: ${SPRINGMIND_DEV_ADMIN_DISPLAY_NAME:开发环境管理员}
    password: ${SPRINGMIND_DEV_ADMIN_PASSWORD:Admin@123456}
    user-code: ${SPRINGMIND_DEV_ADMIN_USER_CODE:admin}
