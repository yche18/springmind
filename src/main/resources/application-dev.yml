server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/springmind
    username: root
    password: 123456
  flyway:
    enabled: true
  ai:
    model:
      embedding: ollama
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: qllama/bge-small-zh-v1.5
          # Let Ollama truncate inputs beyond the model context window instead of failing ingestion.
          truncate: true
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 512
        max-document-batch-size: 9
        initialize-schema: true
        table-name: vector_store

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:springmind-documents}

ingestion:
  chunking:
    target-tokens: 240
    max-tokens: 320
    overlap-tokens: 32
  vector:
    # Limit chunks per VectorStore.add call to reduce pressure on each Ollama embedding request.
    add-batch-size: 9

elasticsearch:
  host: localhost
  port: 9200
  scheme: http
  index-name: springmind_document_chunks

springmind:
  auth:
    issuer: springmind
    access-token-expire-minutes: 30
    refresh-token-expire-days: 14
    # Development-only fallback; production must provide an explicit secure secret.
    jwt-secret: ${SPRINGMIND_JWT_SECRET:springmind-dev-jwt-secret-2026-04-20-32bytes}
    refresh-cookie-name: SPRINGMIND_REFRESH_TOKEN
    refresh-cookie-secure: false
  dev-admin:
    username: ${SPRINGMIND_DEV_ADMIN_USERNAME:admin}
    email: ${SPRINGMIND_DEV_ADMIN_EMAIL:admin@local.springmind.test}
    display-name: ${SPRINGMIND_DEV_ADMIN_DISPLAY_NAME:开发环境管理员}
    password: ${SPRINGMIND_DEV_ADMIN_PASSWORD:Admin@123456}
    user-code: ${SPRINGMIND_DEV_ADMIN_USER_CODE:admin}
