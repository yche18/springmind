spring:
  application:
    name: springmind
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 256MB
      max-request-size: 256MB

qa:
  evidence:
    max-tokens: ${QA_EVIDENCE_MAX_TOKENS:4096}
    candidate-limit: 30
    rerank-enabled: ${RERANK_ENABLED:false}
    rerank-url: ${RERANK_URL:}
    rerank-api-key: ${RERANK_API_KEY:}
    rerank-model: ${RERANK_MODEL:}
    rerank-timeout: ${RERANK_TIMEOUT:2s}

document:
  ingestion:
    worker-enabled: true
    poll-interval-ms: 2000

app:
  ai:
    chat:
      # Any OpenAI-compatible chat endpoint can be used.
      base-url: ${AI_BASE_URL:https://api.openai.com/v1}
      api-key: ${AI_API_KEY:}
      model: ${AI_CHAT_MODEL:gpt-4o-mini}
